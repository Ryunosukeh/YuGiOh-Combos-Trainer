# Baut das Datenpaket (Project Ignis + YGOPRODeck) und die Web-App und veröffentlicht beides auf GitHub Pages.
# Das Datenpaket landet NICHT in der Git-Historie, nur im Pages-Artefakt.
# Nach bestandenen Tests: Android-APK bauen und als Vorabversion „android-latest“ veröffentlichen.
name: Datenpaket und Web-App

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # montags 03:23 UTC: neue Karten, Skript-Fixes, Banliste
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci

      # Geklonte Quell-Repos und YGOPRODeck-Antwort zwischenspeichern (schont YGOPRODeck, spart Zeit).
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-sources-${{ github.run_id }}
          restore-keys: data-sources-

      - name: Datenpaket bauen
        shell: bash
        run: |
          node --version
          set -o pipefail
          npm run update-data 2>&1 | tee update-data.log

      - name: Fehlerausgabe als Annotation
        if: failure()
        shell: bash
        run: |
          for f in update-data.log test.log e2e.log; do
            [ -f "$f" ] && echo "::error title=$f::$(tail -c 3000 "$f" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r//g; s/\n/%0A/g')"
          done
          true

      - name: Typprüfung
        run: npm run typecheck

      - name: Engine-Tests (inkl. Abnahme-Combo)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Web-App bauen
        run: npm run build:site

      - name: Oberflächentests (Hoch- und Querformat)
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      - name: Screenshots aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    # Nur bei Code-Änderungen (nicht beim wöchentlichen Datenlauf – die App lädt die Daten ohnehin von Pages).
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Vorabversion mit der APK anlegen
    env:
      # Secrets sind in „if:“ nicht direkt nutzbar → als Merker.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Web-App ohne Datenpaket: die App lädt es von GitHub Pages (CORS erlaubt) und speichert es auf dem Gerät.
      - name: Web-App bauen und in Android-Projekt kopieren
        run: |
          npm run build
          npx cap sync android

      - name: Release-Schlüssel bereitstellen (falls als Secret hinterlegt)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          VERSION="$(node -p "require('../package.json').version")-${{ github.run_number }}"
          TASKS="assembleDebug"
          [ -n "$ANDROID_KEYSTORE_FILE" ] && TASKS="$TASKS assembleRelease"
          ./gradlew $TASKS -PversionCode=${{ github.run_number }} -PversionName="$VERSION" --no-daemon
          mkdir -p ../apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/combo-trainer-debug.apk
          [ -f app/build/outputs/apk/release/app-release.apk ] && cp app/build/outputs/apk/release/app-release.apk ../apk/combo-trainer.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/

      - name: Als Vorabversion „android-latest“ veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest apk/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android-App (aktueller Stand, $VERSION)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Installation: siehe docs/ANDROID.md. combo-trainer-debug.apk = Debug-Build (fester Debug-Schlüssel, Updates lassen sich drüberinstallieren)."
