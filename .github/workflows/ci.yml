# CI für alle Plattformen:
#   build    – Datenpaket (Project Ignis + YGOPRODeck), Typprüfung, Engine- und Oberflächentests, Web-App
#   deploy   – Web-App + Datenpaket auf GitHub Pages (das Datenpaket landet NIE in der Git-Historie)
#   android  – APK (Capacitor)            ┐ nach bestandenen Tests, parallel
#   windows  – EXE + Installer (Tauri)    ┘
#   release  – Vorabversion „latest“ mit APK und EXE (nur main)
# Pull Requests: build + android + windows (prüfen, ob alles baut), ohne Veröffentlichung.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # montags 03:23 UTC: neue Karten, Skript-Fixes, Banliste
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: ältere Läufe abbrechen. main: nacheinander (Pages/Release nicht gleichzeitig schreiben).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci

      # Geklonte Quell-Repos und YGOPRODeck-Antwort zwischenspeichern (schont YGOPRODeck, spart Zeit).
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-sources-${{ github.run_id }}
          restore-keys: data-sources-

      - name: Datenpaket bauen
        shell: bash
        run: |
          node --version
          set -o pipefail
          npm run update-data 2>&1 | tee update-data.log

      - name: Fehlerausgabe als Annotation
        if: failure()
        shell: bash
        run: |
          for f in update-data.log test.log e2e.log; do
            [ -f "$f" ] && echo "::error title=$f::$(tail -c 3000 "$f" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r//g; s/\n/%0A/g')"
          done
          true

      - name: Typprüfung
        run: npm run typecheck

      - name: Engine-Tests (inkl. Abnahme-Combo)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Web-App bauen
        run: npm run build:site

      - name: Oberflächentests (Hoch- und Querformat)
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      - name: Screenshots aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    # Nicht beim wöchentlichen Datenlauf – die Apps laden die Daten ohnehin von Pages.
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    env:
      # Secrets sind in „if:“ nicht direkt nutzbar → als Merker.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Web-App ohne Datenpaket: die App lädt es von GitHub Pages (CORS erlaubt) und speichert es auf dem Gerät.
      - name: Web-App bauen und in Android-Projekt kopieren
        run: |
          npm run build
          npx cap sync android

      - name: Release-Schlüssel bereitstellen (falls als Secret hinterlegt)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          # versionCode muss immer steigen. Der alte Workflow (pages.yml) kam bis Lauf 14 → Versatz 100,
          # sonst lehnt Android das Update ab („App nicht installiert“).
          CODE=$(( ${{ github.run_number }} + 100 ))
          VERSION="$(node -p "require('../package.json').version")-$CODE"
          TASKS="assembleDebug"
          [ -n "$ANDROID_KEYSTORE_FILE" ] && TASKS="$TASKS assembleRelease"
          ./gradlew $TASKS -PversionCode=$CODE -PversionName="$VERSION" --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/combo-trainer-debug.apk
          [ -f app/build/outputs/apk/release/app-release.apk ] && cp app/build/outputs/apk/release/app-release.apk ../out/combo-trainer.apk
          true

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  windows:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: npm

      # Rust ist auf den Windows-Runnern vorinstalliert; Cache spart beim nächsten Lauf das Kompilieren der Abhängigkeiten.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Wie die Android-App: ohne Datenpaket, die EXE lädt es von GitHub Pages.
      - name: EXE und Installer bauen (Tauri)
        run: npx tauri build --bundles nsis

      - name: Dateien einsammeln
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/combo-trainer.exe out/combo-trainer-portable.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/combo-trainer-setup.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  release:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Vorabversion anlegen
    steps:
      # Nur APK und EXE (nicht die Screenshots der Tests).
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out

      - name: Vorabversion „latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          ls -la out
          # Erst prüfen, dann die alte Version löschen – sonst steht bei einem Fehler gar nichts mehr zum Download.
          for f in combo-trainer-debug.apk combo-trainer-setup.exe combo-trainer-portable.exe; do
            [ -f "out/$f" ] || { echo "::error::$f fehlt"; exit 1; }
          done
          # Frühere Einzel-Vorabversion der Android-App (bis Schritt 6) aufräumen.
          gh release delete android-latest --yes --cleanup-tag || true
          gh release delete latest --yes --cleanup-tag || true
          {
            echo "Automatisch gebaut aus ${GITHUB_SHA::7} (Lauf ${{ github.run_number }}). Anleitung: docs/ANDROID.md und docs/WINDOWS.md."
            echo
            echo "| Datei | Wofür |"
            echo "|---|---|"
            echo "| combo-trainer-debug.apk | Android (Debug-Build, Updates lassen sich drüberinstallieren) |"
            [ -f out/combo-trainer.apk ] && echo "| combo-trainer.apk | Android, signierte Release-APK |"
            echo "| combo-trainer-setup.exe | Windows 10/11, Installation ohne Adminrechte |"
            echo "| combo-trainer-portable.exe | Windows 10/11, ohne Installation starten |"
            echo
            echo "Web-App ohne Installation: https://ryunosukeh.github.io/YuGiOh-Combos-Trainer/"
          } > notes.md
          gh release create latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "Aktueller Stand (Lauf ${{ github.run_number }})" --notes-file notes.md
