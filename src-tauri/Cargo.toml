[package]
name = "combo-trainer"
version = "0.1.0"
description = "Yu-Gi-Oh! Combo-Trainer – Desktop-Hülle (Tauri) für die Web-App"
authors = ["Louis Petermann"]
license = "AGPL-3.0-only"
repository = "https://github.com/Ryunosukeh/YuGiOh-Combos-Trainer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "combo_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[profile.release]
# Kleinere EXE; die Arbeit macht ohnehin die Web-App (WASM-Kern im Web Worker).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
